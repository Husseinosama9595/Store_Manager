<div class="container-fluid min-vh-100 d-flex align-items-center justify-content-center bg-light">

    <div class="card shadow-lg border-0 rounded-4 p-4 p-md-5" style="max-width: 450px; width: 100%;">

        <!-- Login Header -->
        <div class="text-center mb-4">
            <h2 class="fw-bold text-dark mb-2">Welcome Back</h2>
            <p class="text-muted mb-0">Please enter your details to sign in</p>
        </div>

        <form #Loginform="ngForm" (ngSubmit)="onSubmit(Loginform)">

            <!-- Email -->
            <div class="form-group mb-3">

                <label for="email" class="form-label fw-semibold">
                    Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    [(ngModel)]="logInDetails.email"
                    required
                    email
                    #email="ngModel"
                    class="form-control form-control-lg rounded-3 shadow-sm"
                    placeholder="Enter your email"
                >

            </div>

            @if(email.invalid && email.touched){
                <div class="alert alert-danger py-2 px-3 rounded-3 small">
                    Please enter a valid email address.
                </div>
            }


            <!-- Password -->
            <div class="form-group mb-3">

                <label for="password" class="form-label fw-semibold">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    [(ngModel)]="logInDetails.password"
                    #password="ngModel"
                    required
                    pattern="^(?=.*[A-Z])(?=.*[a-z])(?=.*[0-9])"
                    class="form-control form-control-lg rounded-3 shadow-sm"
                    placeholder="Enter your password"
                >

            </div>

            @if(password.invalid && password.touched){
                <div class="alert alert-danger py-2 px-3 rounded-3 small">
                    Please enter a valid password.
                </div>
            }


            <!-- Login Button -->
            <button
                type="submit"
                class="btn btn-primary btn-lg w-100 rounded-3 fw-semibold mt-3 shadow-sm"
                [disabled]="Loginform.invalid"
            >
                Login
            </button>

        </form>

        <!-- Footer -->
        <div class="text-center mt-4">
            <p class="text-muted small mb-0">
                Don't have an account?
                <a routerLink="/register" class="text-primary fw-semibold text-decoration-none">
                    Create one
                </a>
            </p>
        </div>

    </div>

</div>
